<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão IPTV Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-body: #05060f; --bg-card: rgba(18, 24, 41, 0.8); --primary: #8b5cf6; --text-main: #f8fafc; --danger: #ef4444; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-body); color: var(--text-main); padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: var(--bg-card); padding: 30px; border-radius: 20px; }
        input { width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 10px; border: none; background: rgba(0,0,0,0.3); color: white; }
        button { width: 100%; padding: 15px; border-radius: 10px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer; }
        .card { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; margin-top: 15px; position: relative; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="authScreen" class="container">
        <h2 id="authTitle" style="text-align:center">Entrar</h2>
        <input type="email" id="email" placeholder="E-mail">
        <input type="password" id="password" placeholder="Senha">
        <button id="authBtn" onclick="handleAuth()">Entrar</button>
        <p style="text-align:center; margin-top:10px; cursor:pointer" onclick="toggleAuth()">Criar conta / Entrar</p>
    </div>

    <div id="appScreen" class="container hidden">
        <h1>Gestão IPTV</h1>
        <button onclick="logout()" style="background:var(--danger)">Sair</button>
        <form id="formCliente" style="margin-top:20px">
            <input type="text" id="nome" placeholder="Nome" required>
            <input type="text" id="usuario" placeholder="Usuário" required>
            <input type="text" id="whats" placeholder="WhatsApp" required>
            <input type="date" id="dataVenc" required>
            <button type="submit">Salvar Cliente</button>
        </form>
        <div id="gridClientes"></div>
    </div>

    <script>
        const supabase = supabase.createClient('https://pfkoqhvzldwzthosrfeg.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBma29xaHZ6bGR3enRob3NyZmVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1OTE4MTcsImV4cCI6MjA5ODE2NzgxN30.zXaqs2PYUpfphQaQYJ3Zg9KGcXgwoOymHXjJzIN_5wE');
        let isLogin = true;
        function toggleAuth() { isLogin = !isLogin; document.getElementById('authTitle').innerText = isLogin ? 'Entrar' : 'Criar Conta'; document.getElementById('authBtn').innerText = isLogin ? 'Entrar' : 'Criar Conta'; }

        async function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (isLogin) {
                const { error } = await supabase.auth.signInWithPassword({email, password});
                if (error) alert(error.message); else checkUser();
            } else {
                const { error, data } = await supabase.auth.signUp({email, password});
                if (error) alert(error.message); 
                else alert('Conta criada! Verifique seu e-mail para confirmar (ou desative a confirmação no painel do Supabase).');
            }
        }

        async function checkUser() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) { document.getElementById('authScreen').classList.add('hidden'); document.getElementById('appScreen').classList.remove('hidden'); loadClientes(); }
        }

        async function loadClientes() {
            const { data } = await supabase.from('clientes').select('*');
            const grid = document.getElementById('gridClientes');
            grid.innerHTML = '';
            data.forEach(c => {
                grid.innerHTML += `<div class="card"><h3>${c.nome}</h3><p>Usuário: ${c.usuario}</p><p>WhatsApp: ${c.whats}</p><button onclick="excluir(${c.id})" style="background:var(--danger)">Excluir</button></div>`;
            });
        }

        document.getElementById('formCliente').onsubmit = async (e) => {
            e.preventDefault();
            await supabase.from('clientes').insert({
                nome: document.getElementById('nome').value,
                usuario: document.getElementById('usuario').value,
                whats: document.getElementById('whats').value,
                data: document.getElementById('dataVenc').value
            });
            loadClientes();
        }

        async function excluir(id) { await supabase.from('clientes').delete().eq('id', id); loadClientes(); }
        async function logout() { await supabase.auth.signOut(); location.reload(); }
        checkUser();
    </script>
</body>
</html>
