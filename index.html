<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão IPTV Pro</title>
    <style>
        :root {
            --bg-body: #05060f;
            --bg-card: rgba(18, 24, 41, 0.8);
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg-body); color: var(--text-main); min-height: 100vh; padding: 40px 20px; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* Header */
        h1 { text-align: center; margin-bottom: 40px; font-weight: 800; font-size: 2.5rem; background: linear-gradient(to right, #8b5cf6, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Formulário Premium */
        #formCliente { background: var(--bg-card); backdrop-filter: blur(16px); padding: 35px; border-radius: 28px; border: 1px solid rgba(255,255,255,0.08); display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 50px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .full-width { grid-column: span 2; }
        input { background: rgba(0, 0, 0, 0.3); border: 2px solid rgba(255,255,255,0.05); padding: 18px; border-radius: 14px; color: white; font-size: 16px; transition: all 0.3s ease; width: 100%; box-sizing: border-box; }
        input:focus { outline: none; border-color: var(--primary); background: rgba(0, 0, 0, 0.4); }
        #btnAdicionar { grid-column: span 2; padding: 20px; border: none; border-radius: 14px; background: var(--primary); color: white; font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 17px; text-transform: uppercase; letter-spacing: 1px; }
        #btnAdicionar:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(139, 92, 246, 0.3); }

        /* Cards Premium */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .card { 
            background: linear-gradient(145deg, #1a1f33, #121829); 
            backdrop-filter: blur(16px); 
            padding: 30px; 
            border-radius: 24px; 
            border: 1px solid rgba(255,255,255,0.08); 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            animation: fadeIn 0.5s ease; 
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .card:hover { transform: translateY(-10px) scale(1.02); border-color: var(--primary); box-shadow: 0 20px 30px rgba(0,0,0,0.5); }
        
        .badge { display: inline-block; padding: 5px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 800; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
        .card.verde .badge { background: rgba(34, 197, 94, 0.1); color: var(--success); border: 1px solid rgba(34, 197, 94, 0.2); }
        .card.amarelo .badge { background: rgba(234, 179, 8, 0.1); color: var(--warning); border: 1px solid rgba(234, 179, 8, 0.2); }
        .card.vermelho .badge { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }
        
        .card h3 { margin-bottom: 15px; font-size: 1.5rem; font-weight: 700; background: linear-gradient(to right, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card p { margin-bottom: 8px; color: var(--text-muted); font-size: 0.95rem; }
        .card strong { color: var(--text-main); font-weight: 600; }
        
        .actions { display: flex; gap: 10px; margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.05); }
        .btn-acao { flex: 1; padding: 10px; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; transition: all 0.3s ease; }
        .btn-excluir { background: rgba(239, 68, 68, 0.05); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.1); }
        .btn-excluir:hover { background: var(--danger); color: white; }
        .btn-editar { background: rgba(234, 179, 8, 0.05); color: var(--warning); border: 1px solid rgba(234, 179, 8, 0.1); }
        .btn-editar:hover { background: var(--warning); color: white; }
        .btn-lembrete { background: rgba(59, 130, 246, 0.05); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.1); }
        .btn-lembrete:hover { background: #3b82f6; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gestão IPTV Pro</h1>
        <form id="formCliente">
            <input type="hidden" id="editIndex" value="-1">
            <input type="text" id="nome" placeholder="Nome do Cliente" required>
            <input type="text" id="usuario" placeholder="Nome de Usuário" required>
            <input type="text" id="whats" placeholder="WhatsApp (XX XXXXX-XXXX)" required class="full-width" maxlength="15">
            <input type="text" id="dataVenc" placeholder="Data Vencimento (DD/MM/AAAA)" required class="full-width" maxlength="10">
            <button type="submit" id="btnAdicionar">Salvar Cliente</button>
        </form>

        <div style="margin-bottom: 30px; display: flex; justify-content: center;">
            <select id="sortSelect" onchange="renderizar()" style="background: rgba(18, 24, 41, 0.8); backdrop-filter: blur(16px); color: var(--text-main); padding: 10px 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); font-size: 14px; font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);">
                <option value="data-asc">📅 Vencimento: Mais perto → Mais longe</option>
                <option value="data-desc">📅 Vencimento: Mais longe → Mais perto</option>
                <option value="nome-asc">🔤 Nome: A → Z</option>
                <option value="nome-desc">🔤 Nome: Z → A</option>
            </select>
        </div>

        <div id="gridClientes" class="grid"></div>
    </div>

    <script>
        const form = document.getElementById('formCliente');
        const whatsInput = document.getElementById('whats');
        const dataInput = document.getElementById('dataVenc');
        const grid = document.getElementById('gridClientes');
        const editIndexInput = document.getElementById('editIndex');
        const sortSelect = document.getElementById('sortSelect');
        let clientes = JSON.parse(localStorage.getItem('clientes')) || [];

        // Máscara de Telefone
        whatsInput.addEventListener('input', (e) => {
            let v = e.target.value.replace(/\D/g, '');
            if (v.length > 11) v = v.substring(0, 11);
            if (v.length > 6) v = v.replace(/^(\d{2})(\d{5})(\d{4})$/, '$1 $2-$3');
            else if (v.length > 2) v = v.replace(/^(\d{2})(\d{0,5})$/, '$1 $2');
            e.target.value = v;
        });

        // Máscara de Data (DD/MM/AAAA)
        dataInput.addEventListener('input', (e) => {
            let v = e.target.value.replace(/\D/g, '');
            if (v.length > 8) v = v.substring(0, 8);
            if (v.length > 4) v = v.replace(/^(\d{2})(\d{2})(\d{4})$/, '$1/$2/$3');
            else if (v.length > 2) v = v.replace(/^(\d{2})(\d{0,2})$/, '$1/$2');
            e.target.value = v;
        });

        // Converte DD/MM/AAAA para YYYY-MM-DD
        function brToIso(br) {
            const [d, m, y] = br.split('/');
            return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
        }

        // Converte YYYY-MM-DD para DD/MM/AAAA
        function isoToBr(iso) {
            const [y, m, d] = iso.split('-');
            return `${d}/${m}/${y}`;
        }

        function renderizar() {
            grid.innerHTML = '';
            const hoje = new Date(); hoje.setHours(0,0,0,0);
            const sortBy = sortSelect.value;
            
            // Ordena os clientes baseado na seleção
            const clientesOrdenados = [...clientes].sort((a, b) => {
                if (sortBy === 'data-asc') return new Date(a.data) - new Date(b.data);
                if (sortBy === 'data-desc') return new Date(b.data) - new Date(a.data);
                if (sortBy === 'nome-asc') return a.nome.localeCompare(b.nome);
                if (sortBy === 'nome-desc') return b.nome.localeCompare(a.nome);
                return 0;
            });
            
            clientesOrdenados.forEach((c) => {
                // Encontra o índice original para permitir edição/exclusão correta
                const originalIndex = clientes.indexOf(c);
                const dataVenc = new Date(c.data + 'T00:00:00');
                const diffDays = Math.ceil((dataVenc - hoje) / (1000 * 60 * 60 * 24));
                
                let classe = 'verde', statusTxt = 'Em dia';
                if (diffDays < 0) { classe = 'vermelho'; statusTxt = 'Vencido!'; }
                else if (diffDays <= 5) { classe = 'amarelo'; statusTxt = 'Vence em ' + diffDays + ' dias'; }

                grid.innerHTML += `<div class="card ${classe}">
                    <span class="badge">${statusTxt}</span>
                    <h3>${c.nome}</h3>
                    <p>👤 Usuário: <strong>${c.usuario}</strong></p>
                    <p>📱 WhatsApp: <strong>${c.whats}</strong></p>
                    <p>📅 Vencimento: <strong>${isoToBr(c.data)}</strong></p>
                    <div class="actions">
                        <button class="btn-acao btn-editar" onclick="editar(${originalIndex})">Editar</button>
                        <button class="btn-acao btn-excluir" onclick="excluir(${originalIndex})">Excluir</button>
                        <button class="btn-acao btn-lembrete" onclick="enviarLembrete('${c.whats.replace(/\D/g, '')}', '${c.nome}', '${c.usuario}', '${isoToBr(c.data)}')">Lembrete</button>
                    </div>
                </div>`;
            });
        }

        form.onsubmit = (e) => {
            e.preventDefault();
            const index = parseInt(editIndexInput.value);
            const cliente = { nome: document.getElementById('nome').value, usuario: document.getElementById('usuario').value, whats: whatsInput.value, data: brToIso(dataInput.value) };
            if (index === -1) clientes.push(cliente);
            else clientes[index] = cliente;
            localStorage.setItem('clientes', JSON.stringify(clientes));
            renderizar(); form.reset(); editIndexInput.value = -1;
            document.getElementById('btnAdicionar').innerText = 'Salvar Cliente';
        };

        function editar(index) {
            const c = clientes[index];
            document.getElementById('nome').value = c.nome;
            document.getElementById('usuario').value = c.usuario;
            whatsInput.value = c.whats;
            dataInput.value = isoToBr(c.data);
            editIndexInput.value = index;
            document.getElementById('btnAdicionar').innerText = 'Atualizar Cliente';
            window.scrollTo(0,0);
        }

        function excluir(index) { 
            if(confirm('Tem certeza?')) { clientes.splice(index, 1); localStorage.setItem('clientes', JSON.stringify(clientes)); renderizar(); }
        }

        function enviarLembrete(whats, nome, usuario, data) {
            const numLimpo = whats.replace(/\D/g, '');
            const texto = `Olá querido(a) cliente ${nome},\n\nSua conta expira em breve,\nSeu plano de R$ 30,00 vence em: ${data},\nseu usuario atual é ${usuario},\nEvite o bloqueio automatico do seu sinal`;

            const msg = encodeURIComponent(texto);
            window.open(`https://wa.me/55${numLimpo}?text=${msg}`, '_blank');
        }

        renderizar();
    </script>
</body>
</html>
