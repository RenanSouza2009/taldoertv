<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão IPTV Pro</title>
    <style>
        :root {
            --bg-body: #05060f;
            --bg-card: rgba(18, 24, 41, 0.8);
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg-body); color: var(--text-main); min-height: 100vh; padding: 40px 20px; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* Header */
        h1 { text-align: center; margin-bottom: 40px; font-weight: 800; font-size: 2.5rem; background: linear-gradient(to right, #8b5cf6, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Formulário Premium */
        #formCliente { background: var(--bg-card); backdrop-filter: blur(16px); padding: 35px; border-radius: 28px; border: 1px solid rgba(255,255,255,0.08); display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 50px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .full-width { grid-column: span 2; }
        input { background: rgba(0, 0, 0, 0.3); border: 2px solid rgba(255,255,255,0.05); padding: 18px; border-radius: 14px; color: white; font-size: 16px; transition: all 0.3s ease; width: 100%; box-sizing: border-box; }
        input:focus { outline: none; border-color: var(--primary); background: rgba(0, 0, 0, 0.4); }
        #btnAdicionar { grid-column: span 2; padding: 20px; border: none; border-radius: 14px; background: var(--primary); color: white; font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 17px; text-transform: uppercase; letter-spacing: 1px; }
        #btnAdicionar:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(139, 92, 246, 0.3); }

        /* Cards Premium */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .card { background: var(--bg-card); backdrop-filter: blur(16px); padding: 30px; border-radius: 28px; border: 1px solid rgba(255,255,255,0.05); transition: all 0.4s ease; animation: fadeIn 0.5s ease; position: relative; }
        .card:hover { transform: translateY(-8px); border-color: var(--primary); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.4); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; margin-bottom: 15px; text-transform: uppercase; }
        .card.verde .badge { background: rgba(34, 197, 94, 0.2); color: var(--success); }
        .card.amarelo .badge { background: rgba(234, 179, 8, 0.2); color: var(--warning); }
        .card.vermelho .badge { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        
        .card h3 { margin-bottom: 10px; font-size: 1.4rem; font-weight: 700; }
        .card p { margin-bottom: 6px; color: var(--text-muted); }
        .card strong { color: var(--text-main); }
        
        .actions { display: flex; gap: 12px; margin-top: 25px; }
        .btn-acao { flex: 1; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .btn-excluir { background: rgba(239, 68, 68, 0.08); color: var(--danger); }
        .btn-excluir:hover { background: var(--danger); color: white; }
        .btn-editar { background: rgba(234, 179, 8, 0.08); color: var(--warning); }
        .btn-editar:hover { background: var(--warning); color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gestão IPTV Pro</h1>
        <form id="formCliente">
            <input type="hidden" id="editIndex" value="-1">
            <input type="text" id="nome" placeholder="Nome do Cliente" required>
            <input type="text" id="usuario" placeholder="Nome de Usuário" required>
            <input type="text" id="whats" placeholder="WhatsApp (XX XXXXX-XXXX)" required class="full-width" maxlength="15">
            <input type="text" id="dataVenc" placeholder="Data Vencimento (DD/MM/AAAA)" required class="full-width" maxlength="10">
            <button type="submit" id="btnAdicionar">Salvar Cliente</button>
        </form>
        <div id="gridClientes" class="grid"></div>
    </div>

    <script>
        const form = document.getElementById('formCliente');
        const whatsInput = document.getElementById('whats');
        const dataInput = document.getElementById('dataVenc');
        const grid = document.getElementById('gridClientes');
        const editIndexInput = document.getElementById('editIndex');
        let clientes = JSON.parse(localStorage.getItem('clientes')) || [];

        // Máscara de Telefone
        whatsInput.addEventListener('input', (e) => {
            let v = e.target.value.replace(/\D/g, '');
            if (v.length > 11) v = v.substring(0, 11);
            if (v.length > 6) v = v.replace(/^(\d{2})(\d{5})(\d{4})$/, '$1 $2-$3');
            else if (v.length > 2) v = v.replace(/^(\d{2})(\d{0,5})$/, '$1 $2');
            e.target.value = v;
        });

        // Máscara de Data (DD/MM/AAAA)
        dataInput.addEventListener('input', (e) => {
            let v = e.target.value.replace(/\D/g, '');
            if (v.length > 8) v = v.substring(0, 8);
            if (v.length > 4) v = v.replace(/^(\d{2})(\d{2})(\d{4})$/, '$1/$2/$3');
            else if (v.length > 2) v = v.replace(/^(\d{2})(\d{0,2})$/, '$1/$2');
            e.target.value = v;
        });

        // Converte DD/MM/AAAA para YYYY-MM-DD
        function brToIso(br) {
            const [d, m, y] = br.split('/');
            return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
        }

        // Converte YYYY-MM-DD para DD/MM/AAAA
        function isoToBr(iso) {
            const [y, m, d] = iso.split('-');
            return `${d}/${m}/${y}`;
        }

        function renderizar() {
            grid.innerHTML = '';
            const hoje = new Date(); hoje.setHours(0,0,0,0);
            
            clientes.forEach((c, index) => {
                const dataVenc = new Date(c.data + 'T00:00:00'); // c.data já está em YYYY-MM-DD
                const diffDays = Math.ceil((dataVenc - hoje) / (1000 * 60 * 60 * 24));
                
                let classe = 'verde', statusTxt = 'Em dia';
                if (diffDays < 0) { classe = 'vermelho'; statusTxt = 'Vencido!'; }
                else if (diffDays <= 5) { classe = 'amarelo'; statusTxt = 'Vence em ' + diffDays + ' dias'; }

                grid.innerHTML += `<div class="card ${classe}">
                    <span class="badge">${statusTxt}</span>
                    <h3>${c.nome}</h3>
                    <p>👤 Usuário: <strong>${c.usuario}</strong></p>
                    <p>📱 WhatsApp: <strong>${c.whats}</strong></p>
                    <p>📅 Vencimento: <strong>${isoToBr(c.data)}</strong></p>
                    <div class="actions">
                        <button class="btn-acao btn-editar" onclick="editar(${index})">Editar</button>
                        <button class="btn-acao btn-excluir" onclick="excluir(${index})">Excluir</button>
                    </div>
                </div>`;
            });
        }

        form.onsubmit = (e) => {
            e.preventDefault();
            const index = parseInt(editIndexInput.value);
            // Salva em formato ISO YYYY-MM-DD para manter a lógica de datas
            const cliente = { 
                nome: document.getElementById('nome').value, 
                usuario: document.getElementById('usuario').value, 
                whats: whatsInput.value, 
                data: brToIso(dataInput.value) 
            };
            if (index === -1) clientes.push(cliente);
            else clientes[index] = cliente;
            localStorage.setItem('clientes', JSON.stringify(clientes));
            renderizar(); form.reset(); editIndexInput.value = -1;
            document.getElementById('btnAdicionar').innerText = 'Salvar Cliente';
        };

        function editar(index) {
            const c = clientes[index];
            document.getElementById('nome').value = c.nome;
            document.getElementById('usuario').value = c.usuario;
            whatsInput.value = c.whats;
            // Converte de volta para DD/MM/AAAA para exibir no input
            dataInput.value = isoToBr(c.data);
            editIndexInput.value = index;
            document.getElementById('btnAdicionar').innerText = 'Atualizar Cliente';
            window.scrollTo(0,0);
        }

        function excluir(index) { 
            if(confirm('Tem certeza?')) { clientes.splice(index, 1); localStorage.setItem('clientes', JSON.stringify(clientes)); renderizar(); }
        }
        renderizar();
    </script>
</body>
</html>
